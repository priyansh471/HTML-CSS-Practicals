<body>
  <h1>Sign Up</h1>

      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname">

    <div>
      <label for="email">Email</label>

    </div>
    <button type="submit">Sign Up</button>
  </form>
